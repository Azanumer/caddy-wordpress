# WordPress on Caddy (reverse proxy + php_fastcgi) — all services on a private net,
# only Caddy publishes ports 80/443. Run: docker compose up -d
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.2-fpm
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - wp-files:/var/www/html
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - wp-files:/var/www/html:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - wordpress

volumes:
  db-data:
  wp-files:
  caddy-data:
  caddy-config:
